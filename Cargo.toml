[package]
name = "gram"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
# if-let chains (`if let ... && ...`) need 1.88 with edition 2024
rust-version = "1.88"

[dependencies]
macroquad = "0.4.16"
quick-xml = "0.38"
rstar = "0.14.0"

# the system clipboard (Ctrl-Shift-C). miniquad's own X11 clipboard answers
# only UTF8_STRING requests, not TARGETS, so apps under Wayland (through
# XWayland) such as GNOME's paste nothing from it; arboard serves the
# selection properly from its own thread
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false }

[profile.dev.package.'*']
opt-level = 3
