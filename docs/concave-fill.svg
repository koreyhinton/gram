    <polyline points="190 200 60 130 160 200 60 270 190 200" stroke="red" fill="lightblue" stroke-width="2"/>
    <text x="300" y="100" fill="black">L shape</text>
    <polyline points="300 130 460 130 460 170 340 170 340 290 300 290 300 130" stroke="red" fill="lightblue" stroke-width="2"/>
    <text x="540" y="100" fill="black">U bracket</text>
    <polyline points="540 130 680 130 680 290 540 290 540 250 640 250 640 170 540 170 540 130" stroke="red" fill="lightblue" stroke-width="2"/>
    <text x="40" y="380" fill="black">chevron</text>
    <polyline points="60 410 140 410 220 490 140 570 60 570 140 490 60 410" stroke="red" fill="lightblue" stroke-width="2"/>
    <text x="300" y="380" fill="black">convex</text>
    <polyline points="380 410 460 490 380 570 300 490 380 410" stroke="red" fill="lightblue" stroke-width="2"/>
</svg>
