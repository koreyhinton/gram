<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="750" height="750" viewBox="0,0,750,750">
    <text x="40" y="50" fill="black">groups: right-click a shape to select its group, again for the group around it</text>
    <g id="outer" stroke-width="2">
        <g id="action" stroke="red">
            <rect rx="10" ry="10" x="100" y="120" width="160" height="60" fill="transparent"/>
            <text x="125" y="155" fill="black" stroke="none">grouped action</text>
        </g>
        <polyline points="260 150 360 150 350 140 360 150 350 160" stroke="black" fill="transparent"/>
        <circle cx="380" cy="150" r="10" fill="black" stroke="black"/>
    </g>
    <rect x="100" y="300" width="160" height="60" stroke="black" fill="transparent" stroke-width="1"/>
    <text x="110" y="335" fill="black">not in a group</text>
</svg>
